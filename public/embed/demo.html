<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLI partner banner — demo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f4;color:#222}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin:32px 24px 10px}
.frame{background:#fff;border:1px solid #ddd;margin:0 24px}
.fake-header{height:90px;display:flex;align-items:center;padding:0 40px;font-weight:700;color:#324f62}
</style>
</head>
<body>
<h2>Desktop (full width)</h2>
<div class="frame"><div class="fake-header">Partner site header</div><div data-voli-banner="evollve"></div><div style="height:120px"></div></div>
<h2>Mobile (390px container)</h2>
<div class="frame" style="width:390px"><div class="fake-header">Partner</div><div data-voli-banner="evollve"></div><div style="height:120px"></div></div>
<script src="embed/banner.js" async></script>
</body>
</html>
